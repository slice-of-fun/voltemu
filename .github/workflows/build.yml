name: Build Volt v0.1

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VOLT_VERSION: ${{ github.ref_name }}

jobs:
  build-windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -S . -B build/windows `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_QT=ON `
            -DVOLT_USE_CPM=ON `
            -DCPMUTIL_FORCE_BUNDLED=ON

      - name: Build
        run: cmake --build build/windows --config Release --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: volt-windows-x64-${{ github.sha }}
          path: build/windows/bin/volt.exe
          retention-days: 14

  build-linux:
    name: Linux (Clang x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential libc++-dev libc++abi-dev \
            clang cmake ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            nasm

      - name: Configure CMake
        run: |
          cmake -S . -B build/linux \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_QT=ON \
            -DVOLT_USE_BUNDLED_QT=ON \
            -DVOLT_USE_BUNDLED_SDL3=ON \
            -DVOLT_USE_CPM=ON \
            -DCPMUTIL_FORCE_BUNDLED=ON

      - name: Build
        run: cmake --build build/linux --parallel $(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: volt-linux-x64-${{ github.sha }}
          path: build/linux/bin/volt
          retention-days: 14

  build-android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: src/android
        run: ./gradlew assembleMainlineRelWithDebInfo

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: volt-android-arm64-${{ github.sha }}.apk
          path: src/android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────
  # Code Style Check
  # ─────────────────────────────────────────────
  clang-format:
    name: clang-format check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-14

      - name: Run clang-format
        run: |
          # Vendored upstream tree (src/dynarmic) keeps its own style and is excluded.
          find src \( -path src/dynarmic -prune \) -o \
            \( -name "*.cpp" -o -name "*.h" \) -print0 | \
          xargs -0 clang-format-14 --dry-run --Werror --style=file
