<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1"
   id="volt-icon"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#060d18"/>
    </radialGradient>
    <!-- Bolt outer glow (yellow/gold) -->
    <linearGradient id="boltGoldGrad" x1="0.35" y1="0" x2="0.65" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="50%"  stop-color="#ffc200"/>
      <stop offset="100%" stop-color="#e08000"/>
    </linearGradient>
    <!-- Bolt inner fill (electric blue) -->
    <linearGradient id="boltBlueGrad" x1="0.3" y1="0" x2="0.7" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#7ee8ff"/>
      <stop offset="50%"  stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0060cc"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft inner glow -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Subtle radial highlight on background -->
  <circle cx="256" cy="200" r="180" fill="none"
          stroke="#1a3a5c" stroke-width="80" opacity="0.25"/>

  <!-- Gold outer bolt (shadow/outline layer) -->
  <polygon
     id="bolt-gold"
     filter="url(#glowFilter)"
     fill="url(#boltGoldGrad)"
     points="
       296,48
       176,268
       232,268
       216,464
       336,244
       278,244
     "
     clip-path="url(#circleClip)"/>

  <!-- Blue inner bolt -->
  <polygon
     id="bolt-blue"
     filter="url(#innerGlow)"
     fill="url(#boltBlueGrad)"
     opacity="0.92"
     points="
       284,80
       188,260
       240,260
       224,440
       320,252
       266,252
     "
     clip-path="url(#circleClip)"/>

  <!-- Thin bright highlight on bolt leading edge -->
  <polygon
     id="bolt-highlight"
     fill="white"
     opacity="0.18"
     points="
       284,80
       260,140
       274,140
       188,260
       240,260
     "
     clip-path="url(#circleClip)"/>

  <!-- Circle border -->
  <circle cx="256" cy="256" r="246"
          fill="none"
          stroke="#1e4a7a"
          stroke-width="4"
          opacity="0.6"/>
</svg>
